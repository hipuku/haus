<style>
  /* A consumer's app root sets the base font; the story canvas is that root.
     Without this, any text not styled by a component (story markup, a Card's
     children, Input adornments, Spinner and axis labels) inherits the browser
     default, which is serif. Set the sans role so the canvas reads like a real
     product and no serif leaks through. */
  body { font-family: var(--haus-font-sans); }
</style>
