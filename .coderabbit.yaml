# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews every pull request. It is not a required check: each comment is
# applied as a normal commit or answered and resolved. The path instructions below are
# the rules from CONTRIBUTING.md and the decision records that a reviewer should hold
# this repo to.
language: en-AU
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  request_changes_workflow: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - '!pnpm-lock.yaml'
    - '!**/dist/**'
    - '!**/coverage/**'
    - '!**/storybook-static/**'
    - '!**/*.snap'
    - '!scripts/punctuation-baseline.json'
    - '!packages/colour-names/src/**/*.json'
    - '!packages/colour-utils/src/colornames.json'
  path_instructions:
    - path: 'packages/components/src/**/*.module.css'
      instructions: >-
        Component styles read roles from the semantic layer (--haus-* custom properties).
        Two primitive reads are allowed: a size off the space ladder, and a primitive whose
        own name is already the role, such as a control height or an icon size. Flag any
        raw colour, length, radius, shadow, duration or font value, and any colour, radius,
        shadow or motion primitive. Flag a physical inline-axis property (margin-left,
        padding-right, left, right) where a logical one exists, and a focus ring with no
        @media (forced-colors: active) fallback.
    - path: 'packages/components/src/**/*.tsx'
      instructions: >-
        The package ships no 'use client', so a stateless component can be rendered by a
        React Server Component. Flag a component that attaches a ref, an event handler or
        any prop the caller did not pass, especially through cloneElement or asChild.
        Flag interactive elements with no accessible name or no keyboard handling, and any
        custom property named without the --haus- prefix. className lands on the root
        element; a second target is a named prop.
    - path: 'packages/tokens/src/{primitives,motion}.css'
      instructions: >-
        Generated by packages/tokens/scripts/build-tokens.ts. Flag any hand edit: the change
        belongs in tokens.json or the generator, and tokens:check fails otherwise.
    - path: 'packages/tokens/src/{brand,semantics}.css'
      instructions: >-
        brand.css holds which primitive each role takes and nothing else: no new names, no
        raw values. semantics.css says what each role means and names no palette. A renamed
        token is a major version at an identical value, and a contrast change is a major
        even when the value barely moves (decision 0004).
    - path: 'packages/*/package.json'
      instructions: >-
        A version change needs a CHANGELOG.md entry in the same pull request. A package
        depending on another workspace package uses workspace:^, and the dependency must be
        published at that version first (RELEASING.md).
    - path: '**/*.md'
      instructions: >-
        Australian English. No em dashes and no spaced hyphens. Headings are topic labels,
        not claims. No marketing language. Flag any statement the code does not support,
        including a count of components, tokens or tests.
chat:
  auto_reply: true
