# One pnpm workspace, so a single npm entry at the root covers every package.
# Weekly and grouped, so a review is one pull request rather than nine.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # React moves the components package and its Storybook together. The peer
      # range is deliberately wider than the dev dependency, so a major here is
      # a decision about what to test against, not about what to support.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      # Storybook's addons version with Storybook, not against it. Listed by
      # name because @chromatic-com/storybook and eslint-plugin-storybook match
      # neither '@storybook/*' nor each other, and a major of either alone is a
      # pull request that cannot pass until the core is upgraded too.
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
          - '@chromatic-com/storybook'
          - 'eslint-plugin-storybook'
          - 'chromatic'
      build:
        patterns: ['tsup', 'vite', '@vitejs/*', 'typescript']
      # The test runner and its environments are their own group. Grouped with
      # the linters, one vitest major holds an eslint patch hostage.
      test:
        patterns: ['vitest', '@vitest/*', 'vitest-axe', 'jsdom', 'happy-dom', '@testing-library/*']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*']
    commit-message:
      prefix: 'deps'
    ignore:
      # @types/node describes the runtime CI installs rather than the newest
      # release line. A major here typechecks against APIs the running Node
      # does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
