name: Publish

# Publishes one package to npm when a `<dir>-v<version>` tag is pushed, where
# `<dir>` is its directory under packages/. So `colour-utils-v0.1.3` publishes
# packages/colour-utils, and `tokens-v0.2.0` publishes packages/tokens.
#
# One workflow rather than one per package: five near-identical files drift
# apart, and the fifth is always the one nobody remembers to add.
#
# Authenticates to npm by trusted publishing (OIDC): GitHub mints a short-lived
# identity token for this workflow, npm verifies it against the trusted publisher
# configured on the package, and no long-lived credential exists to leak, rotate
# or expire. There is deliberately no NPM_TOKEN secret. Each package must have
# this repository and this workflow filename registered as its trusted publisher
# on npmjs.com first; see RELEASING.md.

on:
  push:
    tags:
      - '*-v*'

jobs:
  # Reading the tag is separated from acting on it so that a tag naming a version
  # already on npm can be skipped rather than failed. Tags are also written after
  # the fact, to give an earlier release a commit to point at, and those must not
  # look like a broken pipeline.
  plan:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.tag.outputs.dir }}
      name: ${{ steps.tag.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
      publish: ${{ steps.published.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Splits the tag and refuses to go further unless the manifest agrees with
      # it. A tag that says 0.1.3 over a package.json that says 0.1.2 publishes
      # something nobody can trace back to a commit.
      - name: Read the tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          dir="${tag%-v*}"
          version="${tag##*-v}"
          manifest="packages/${dir}/package.json"

          if [ ! -f "$manifest" ]; then
            echo "No package at ${manifest}. The tag prefix must be a directory under packages/."
            exit 1
          fi

          name=$(node -p "require('./${manifest}').name")
          declared=$(node -p "require('./${manifest}').version")

          if [ "$declared" != "$version" ]; then
            echo "Tag ${tag} wants ${version}, but ${manifest} says ${declared}."
            exit 1
          fi

          echo "dir=${dir}"         >> "$GITHUB_OUTPUT"
          echo "name=${name}"       >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Is this version already on npm?
        id: published
        run: |
          if npm view "${{ steps.tag.outputs.name }}@${{ steps.tag.outputs.version }}" version > /dev/null 2>&1; then
            echo "${{ steps.tag.outputs.name }}@${{ steps.tag.outputs.version }} is already published. Nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest

    # id-token lets this job request the OIDC token npm authenticates against.
    # Without it the publish fails with no credential, and no secret can stand in.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: |
          echo "Publishing ${{ needs.plan.outputs.name }}@${{ needs.plan.outputs.version }} from packages/${{ needs.plan.outputs.dir }}"

      - run: pnpm install --frozen-lockfile

      # pnpm rewrites `workspace:^` to the dependency's real version at publish
      # time. If that version is not on npm the published package is installable
      # but broken, and the first person to find out is a consumer.
      - name: Workspace dependencies are published
        run: |
          required=$(node -e "
            const dir = process.argv[1];
            const manifest = require('./packages/' + dir + '/package.json');
            const deps = { ...(manifest.dependencies || {}), ...(manifest.peerDependencies || {}) };
            const out = Object.keys(deps)
              .filter((d) => String(deps[d]).startsWith('workspace:'))
              .map((d) => d + '@' + require('./packages/' + d.replace(/^haus-/, '') + '/package.json').version);
            console.log(out.join(' '));
          " "${{ needs.plan.outputs.dir }}")

          if [ -z "$required" ]; then
            echo "No workspace dependencies to check."
            exit 0
          fi

          for dep in $required; do
            if npm view "$dep" version > /dev/null 2>&1; then
              echo "${dep} is published"
            else
              echo "${{ needs.plan.outputs.name }} depends on ${dep}, which is not on npm."
              echo "Publish that package first. See RELEASING.md."
              exit 1
            fi
          done

      # `...<name>` is "this package and everything it depends on". components
      # cannot typecheck without haus-tokens' dist, and dist is gitignored, so
      # building the target alone fails on any package with a workspace
      # dependency.
      - name: Build
        run: pnpm --filter "...${{ needs.plan.outputs.name }}" run build

      - name: Test
        run: pnpm --filter ${{ needs.plan.outputs.name }} run --if-present test

      # Trusted publishing is npm CLI only, and only from 11.5.1. The npm that
      # ships with Node 22 is older than that, so it is upgraded rather than
      # trusted to be new enough.
      - name: Upgrade npm to a version that speaks OIDC
        run: npm install -g npm@latest

      # Two tools, because each does one half. pnpm rewrites `workspace:^` to the
      # dependency's real version as it packs. npm would publish the manifest
      # verbatim and ship something no consumer can resolve. npm is what holds
      # the OIDC credential. So pnpm makes the tarball and npm publishes it.
      - name: Pack
        id: pack
        run: |
          pnpm --filter ${{ needs.plan.outputs.name }} pack --pack-destination "${RUNNER_TEMP}"
          tarball=$(ls "${RUNNER_TEMP}"/*.tgz)
          echo "Packed ${tarball}"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      # No token, no .npmrc credential. Provenance is attached automatically,
      # because npm can prove which workflow and which commit produced this.
      - name: Publish
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public
