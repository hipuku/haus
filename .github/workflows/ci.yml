name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm -r run typecheck

      # Packages resolve through dist/, which is gitignored, so the workspace
      # must be built before anything can import across package boundaries.
      - name: Build packages
        run: pnpm run build

      - name: Test
        run: pnpm -r run test

      - name: Build Storybook
        run: pnpm run build-storybook
