name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Tokens, Lint, Build, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generated primitives must match tokens.json. This is what replaced the
      # test that used to compare the three hand-maintained copies.
      - name: Tokens up to date
        run: pnpm --filter haus-tokens run tokens:check

      - name: Lint
        run: pnpm run lint

      # The hardcoded-value gate. Catches a component reaching past the token
      # layer, the common failure when components are generated rather than
      # hand-written.
      - name: Lint CSS (design tokens)
        run: pnpm run lint:css

      # Packages resolve through dist/, which is gitignored, and workspace:^ links
      # them to each other, so nothing can typecheck across a package boundary
      # until the workspace is built. This used to sit after Typecheck and passed
      # only because the internal dependencies resolved to their published copies
      # on npm, which ship a dist.
      - name: Build packages
        run: pnpm run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm -r run test

      - name: Build Storybook
        run: pnpm run build-storybook
