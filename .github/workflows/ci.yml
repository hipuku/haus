name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One job per check, named exactly as the ruleset on main requires them: Lint,
# Links, Format, Typecheck, Test and Build. They run in parallel, and Build runs last,
# after the other four pass, so a red tick names the check that failed rather than a step
# inside one long job.
#
# Packages resolve each other through dist/, which is gitignored, and workspace:^
# links them, so nothing can typecheck or test across a package boundary until the
# workspace is built. Typecheck and Test build the packages first for that reason;
# the five build in seconds.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      # The hardcoded-value gate. Catches a component reaching past the token
      # layer, the common failure when components are generated rather than
      # hand-written.
      - name: Stylelint (design tokens)
        run: pnpm run lint:css

      # House style does not use an em dash. Ratcheted against a baseline rather
      # than absolute: a rule that could only pass after a mechanical rewrite of
      # every file would have been turned off instead of adopted.
      - name: Prose
        run: pnpm run lint:prose

      # Markdown structure. Prettier owns wrapping and the docs standard owns
      # voice, so this checks headings, lists, fences and the like.
      - name: Markdown
        run: pnpm run lint:md

      # Every component the registry ships has a page on the docs site.
      - name: Docs coverage
        run: pnpm run lint:docs

      # Unused files, exports and dependencies across the workspace.
      - name: Knip
        run: pnpm run knip

  # Every relative link and heading anchor in the markdown resolves, .github
  # included (--hidden). Offline, so the check never fails because an outside
  # site is slow.
  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress --hidden --exclude-path node_modules --exclude-path '(^|/)\.git/' './**/*.md'
          fail: true

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm run build
      - name: Typecheck
        run: pnpm -r run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm run build
      # With coverage, so the floors in each vitest.config.ts are enforced here
      # rather than being a number someone can run locally and ignore.
      - name: Test
        run: pnpm -r run test:coverage
      # The repository's own scripts: the Figma parity check's decision rules.
      - name: Script tests
        run: pnpm run test:scripts

  # Every story rendered in a real browser, with the stylesheet on, checked by
  # axe and compared against a committed screenshot, in light and in dark. The
  # component suites run under `css: false`, so a contrast pair is not
  # measurable there and this is the only place one is.
  #
  # Separate from Test because it is the slow one and because the ruleset names
  # checks: a red Stories tick says the thing it says.
  stories:
    name: Stories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm run build

      # The browser the committed screenshots were taken with. `--with-deps`
      # installs the system libraries Chromium needs on a clean runner.
      - name: Install Chromium
        run: pnpm --filter storybook exec playwright install --with-deps chromium

      - name: Stories
        run: pnpm --filter storybook run test:stories

      # A failed run has written whatever it saw: the actual image beside the
      # reference, and a diff. Without this the log says a screenshot changed
      # and shows nobody the change. It also carries the Linux references the
      # first run on a new story writes, which is how a new baseline gets into
      # the repository.
      - name: Keep the images from a failed run
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: story-screenshots
          path: |
            apps/storybook/stories/**/__screenshots__/**
            apps/storybook/.vitest/attachments/**
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    needs: [lint, format, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Generated primitives must match tokens.json. This is what replaced the
      # test that used to compare the three hand-maintained copies.
      - name: Tokens up to date
        run: pnpm --filter @hipuku/tokens run tokens:check

      - name: Build packages
        run: pnpm run build

      - name: Build Storybook
        run: pnpm run build-storybook
