name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One job per check, named exactly as the ruleset on main requires them: Lint,
# Format, Typecheck, Test and Build. They run in parallel, and Build runs last,
# after the other four pass, so a red tick names the check that failed rather than a step
# inside one long job.
#
# Packages resolve each other through dist/, which is gitignored, and workspace:^
# links them, so nothing can typecheck or test across a package boundary until the
# workspace is built. Typecheck and Test build the packages first for that reason;
# the five build in seconds.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      # The hardcoded-value gate. Catches a component reaching past the token
      # layer, the common failure when components are generated rather than
      # hand-written.
      - name: Stylelint (design tokens)
        run: pnpm run lint:css

      # House style does not use an em dash. Ratcheted against a baseline rather
      # than absolute: a rule that could only pass after a mechanical rewrite of
      # every file would have been turned off instead of adopted.
      - name: Prose
        run: pnpm run lint:prose

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm run build
      - name: Typecheck
        run: pnpm -r run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm run build
      # With coverage, so the floors in each vitest.config.ts are enforced here
      # rather than being a number someone can run locally and ignore.
      - name: Test
        run: pnpm -r run test:coverage

  build:
    name: Build
    needs: [lint, format, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Generated primitives must match tokens.json. This is what replaced the
      # test that used to compare the three hand-maintained copies.
      - name: Tokens up to date
        run: pnpm --filter haus-tokens run tokens:check

      - name: Build packages
        run: pnpm run build

      - name: Build Storybook
        run: pnpm run build-storybook
