name: Chromatic

# Both events, because Chromatic needs both to work at all.
#
# A baseline is promoted when Chromatic builds the base branch. Running on pull
# requests alone means main is never built, no baseline is ever promoted, and
# every pull request re-reports the same changes against nothing. This ran that
# way and produced no visual diff at any point, which was invisible because the
# job also skipped for a missing token.
#
# Direct pushes to main are the normal workflow here, so main is where the
# baseline has to come from. Snapshots cost one per story per browser per run;
# this Storybook has eighteen story files on one browser, which is a small bill
# for the only visual regression in the portfolio.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    # Skips cleanly rather than failing red when the token is absent — on a fork,
    # or before anyone has set it. A visual-regression job that fails for people
    # who cannot possibly fix it teaches everyone to ignore a red tick.
    #
    # The fork guard applies to pull requests only: a push event has no
    # `pull_request` context, so testing it there would skip every push.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Chromatic diffs against a baseline commit, so it needs the history to
          # find one. With a shallow clone every run looks like the first run and
          # every story reads as a change.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The packages first: the Storybook consumes the built dist, not the source.
      - run: pnpm run build

      - name: Publish to Chromatic
        id: chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        uses: chromaui/action@v13
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/storybook
          # Storybook is already built by the step above's dependency graph; this
          # keeps the action from building it a second time.
          buildScriptName: build-storybook
          # A visual change is for a human to accept or reject. Failing the build
          # on one would mean every intentional design change arrives as a red
          # tick, which is how teams learn to merge past this job.
          exitZeroOnChanges: true
          # On main, accept: main is the baseline, and whatever is on it is by
          # definition what the system looks like now. On a pull request, do not:
          # that is the diff a human is meant to read before it becomes the
          # baseline. Getting this the wrong way round is how a team ends up
          # accepting regressions in review and re-reviewing them forever.
          autoAcceptChanges: ${{ github.ref == 'refs/heads/main' }}

      - name: Say why this was skipped
        if: ${{ env.CHROMATIC_PROJECT_TOKEN == '' }}
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          echo "::notice::CHROMATIC_PROJECT_TOKEN is not set, so no visual diff ran."
          echo "Add it under Settings → Secrets and variables → Actions."
