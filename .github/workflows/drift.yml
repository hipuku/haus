name: Design system drift

# Runs loom's audit against this checkout: Figma intent, as exported and
# committed in loom, versus the value a real browser computes from haus's
# stylesheets. The audit is deterministic — no AI, no network beyond checkout.
#
# It reports rather than blocks. Four of the current findings are a known gap
# (semantic tokens that apply alpha in CSS, which the token model does not
# express) and one is a deliberately seeded stale token. Failing on those would
# teach everyone to ignore the job, so it comments instead.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  drift:
    name: Figma vs shipped
    runs-on: ubuntu-latest
    steps:
      - name: Check out haus
        uses: actions/checkout@v4
        with:
          path: haus

      # loom holds the committed Figma export and the audit itself. Checking it
      # out is simpler than publishing the audit as a package, and keeps the two
      # in step without a release cycle between them.
      - name: Check out loom
        uses: actions/checkout@v4
        with:
          repository: hipuku/loom
          path: loom

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install loom
        working-directory: loom
        run: npm ci

      - name: Install Chromium
        working-directory: loom
        run: npx playwright install --with-deps chromium

      - name: Run the audit
        id: audit
        working-directory: loom
        env:
          # The audit's defaults assume a sibling checkout; CI lays them out
          # differently, so both inputs are pointed at explicitly.
          LOOM_HAUS_TOKENS: ${{ github.workspace }}/haus/packages/tokens/src
          LOOM_FIGMA_EXPORT: ${{ github.workspace }}/loom/fixtures/figma-haus.json
        run: |
          npx tsx src/audit.ts --markdown > "$GITHUB_STEP_SUMMARY"
          {
            echo 'report<<AUDIT_EOF'
            cat "$GITHUB_STEP_SUMMARY"
            echo 'AUDIT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.audit.outputs.report }}`
            const marker = '### loom · design system audit'

            // Update the existing comment rather than adding one per push —
            // a PR with ten commits should not carry ten audit comments.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith(marker),
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
