name: A claim that is not true
description: A document, comment or type says something the code does not do.
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        This has its own template because it is the most common defect in this
        repository and the easiest to walk past. A README that overstates is a
        bug with no stack trace.
  - type: input
    id: where
    attributes:
      label: Where the claim is
      placeholder: packages/components/README.md, line 40
    validations: { required: true }
  - type: textarea
    id: claim
    attributes:
      label: What it claims
    validations: { required: true }
  - type: textarea
    id: reality
    attributes:
      label: What is actually true, and how you checked
      description: A command, a file and line, or a failing assertion.
    validations: { required: true }
