# Groups a GitHub release's generated notes by pull request label. haus releases one
# package per tag, so the notes are a draft: the CHANGELOG entry for that package is
# what a release says, and these group the pull requests under it.
changelog:
  exclude:
    labels: [skip-changelog]
    authors: ['dependabot[bot]']
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [feature]
    - title: Design
      labels: [design]
    - title: Accessibility
      labels: [a11y]
    - title: Fixes
      labels: [fix]
    - title: Documentation
      labels: [docs]
    - title: Other changes
      labels: ['*']
